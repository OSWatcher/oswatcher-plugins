[tool.poetry]
name = "plugins"
version = "0.1.0"
description = ""
authors = ["Mathieu Tarral <mathieu.tarral@protonmail.com>"]
license = "private"
readme = "README.md"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
runner = 'plugins.__main__:runner'

[tool.poetry.dependencies]
python = "^3.11"
poethepoet = "^0.24.3"
ipdb = "^0.13.13"
click = "^8.1.7"
attrs = "^23.2.0"
dynaconf = "^3.2.5"
python-magic = "^0.4.27"


[tool.poetry.group.dev.dependencies]
black = "24.3.0"
flake8 = "6.0.0"
isort = "5.11.4"
mypy = "1.7.0"
appdirs-stubs = "^0.1.0"
types-appdirs = "^1.4.3.1"
neogit = { path = "../neogit", develop = true }

[tool.poe.tasks]
fmt = "black ."
_flake8 = "flake8 --show-source --statistics ."
_isort = "isort ."
lint = ["_flake8", "_isort"]
ccode = ["fmt", "lint"]
