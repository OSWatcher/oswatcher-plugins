[tool.poetry]
name = "plugins"
version = "0.12.2"
description = ""
authors = ["Mathieu Tarral <mathieu.tarral@protonmail.com>"]
license = "private"
readme = "README.md"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
runner = 'plugins.__main__:runner'

[tool.poetry.dependencies]
python = "^3.11"
neogit = { git = "https://github.com/OSWatcher/neogit.git", tag = "v0.13.2" }
poethepoet = "^0.26.1"
ipdb = "^0.13.13"
click = "^8.1.7"
attrs = "^23.2.0"
dynaconf = "^3.2.5"
python-magic = "^0.4.27"
lief = "0.14.0"
volatility3 = "^2.5.2"
regipy = "^4.1.1"
jsonschema = "^4.21.1"
pypeln = "^0.4.9"
# setuptools required for pkg_resources compatibility
# pypeln -> stopit -> pkg_resources (may be missing in some virtual environments)
# See: https://github.com/glenfant/stopit/issues/32
setuptools = "*"


[tool.poetry.group.dev.dependencies]
poethepoet = "^0.26.1"
black = "24.3.0"
flake8 = "6.0.0"
isort = "5.11.4"
mypy = "1.9.0"
appdirs-stubs = "^0.1.0"
types-appdirs = "^1.4.3.1"
ipdb = "^0.13.13"
pdbpp = "^0.10.3"

[tool.poe.tasks]
fmt = "black ."
_flake8 = "flake8 --show-source --statistics ."
_isort = "isort ."
lint = ["_flake8", "_isort"]
typing = "mypy -p plugins"
ccode = ["fmt", "lint"]

[tool.black]
line-length = 120

[tool.isort]
# black compatible config
# https://black.readthedocs.io/en/stable/compatible_configs.html
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.mypy]
warn_unreachable = true
# TODO: warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
