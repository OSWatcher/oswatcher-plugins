name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:
  dev:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        make_target: [fmt, lint, typing]
        include:
          - make_target: fmt
            extra_args: --check
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup

      - name: Run check
        run: poetry run poe ${{ matrix.make_target }} ${{ matrix.extra_args }}

  unit_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup
        with:
          python_version: ${{ matrix.python_version }}

      - name: Run unit tests
        run: poetry run poe test-unit

  publish_pypi:
    needs: [dev, unit_test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Project setup
        uses: ./.github/actions/common-setup

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(poetry version --short)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match pyproject version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build and publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish --build --no-interaction --skip-existing

  release:
    needs: [publish_pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: Create a Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
